# Execução em VPS: app (API + painel) + worker separado. Banco = Supabase.
#   docker compose up -d --build
# Coloque um proxy com HTTPS (Caddy/Nginx) na frente da porta 5000.
services:
  app:
    build: .
    env_file: .env
    environment:
      EMBEDDED_WORKER: "false"   # na VPS o worker roda no serviço abaixo
    ports:
      - "5000:5000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  worker:
    build: .
    env_file: .env
    environment:
      EMBEDDED_WORKER: "false"
    command: ["python", "worker.py"]
    restart: unless-stopped
    depends_on:
      - app
